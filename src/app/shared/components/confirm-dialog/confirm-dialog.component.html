@if (isOpen()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-[60] flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
  >
    <div
      class="absolute inset-0 bg-black/60 backdrop-blur-sm"
      (click)="cancelled.emit()"
    ></div>

    <!-- Modal -->
    <div class="relative z-10 w-full max-w-sm bg-white rounded-xl shadow-xl p-6 space-y-4">
      <!-- Icon -->
      @if (confirmVariant() === 'success') {
        <div class="flex items-center justify-center w-12 h-12 mx-auto rounded-full bg-green-100">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-green-600">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
        </div>
      } @else {
        <div class="flex items-center justify-center w-12 h-12 mx-auto rounded-full bg-red-100">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-red-600">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
        </div>
      }

      <!-- Text -->
      <div class="text-center space-y-1">
        <h3 class="text-lg font-semibold text-gray-900">{{ title() }}</h3>
        <p class="text-sm text-gray-500">{{ message() }}</p>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-1">
        <button
          type="button"
          (click)="cancelled.emit()"
          class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300
                 rounded-lg hover:bg-gray-50 transition-colors"
        >
          {{ cancelLabel() }}
        </button>
        @if (confirmVariant() === 'primary') {
          <button
            type="button"
            (click)="confirmed.emit()"
            class="flex-1 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors"
          >{{ confirmLabel() }}</button>
        } @else if (confirmVariant() === 'success') {
          <button
            type="button"
            (click)="confirmed.emit()"
            class="flex-1 px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 transition-colors"
          >{{ confirmLabel() }}</button>
        } @else {
          <button
            type="button"
            (click)="confirmed.emit()"
            class="flex-1 px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors"
          >{{ confirmLabel() }}</button>
        }
      </div>
    </div>
  </div>
}
