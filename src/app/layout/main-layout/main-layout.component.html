<div class="flex h-screen bg-gray-100">
  <app-sidebar [isOpen]="sidebarOpen()" (closed)="sidebarOpen.set(false)" />

  <div class="flex flex-col flex-1 min-w-0 lg:ml-64">
    <!-- Mobile top bar -->
    <header class="lg:hidden flex items-center gap-3 px-4 h-14 bg-white border-b border-gray-200 shrink-0">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-4 h-4 text-white">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
      </div>
      <span class="text-sm font-bold text-gray-900">Chelali Ice Plant</span>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-20 lg:pb-6 lg:p-6">
      <router-outlet />
    </main>
  </div>

  <!-- Mobile bottom navbar -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 flex">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="text-blue-600"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2 text-gray-500 hover:text-blue-600 transition-colors duration-150"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-5 h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        <span class="text-[10px] font-medium leading-none">{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
