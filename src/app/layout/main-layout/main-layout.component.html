<div class="flex h-screen bg-gray-100">
  <app-sidebar [isOpen]="sidebarOpen()" (closed)="sidebarOpen.set(false)" />

  <div class="flex flex-col flex-1 min-w-0 lg:ml-64">
    <!-- Mobile top bar -->
    <header class="lg:hidden flex items-center gap-3 px-4 h-14 bg-white border-b border-gray-200 shrink-0">
      <button (click)="toggleSidebar()" class="p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
      <span class="text-sm font-bold text-gray-900">Chelali Ice Plant</span>
    </header>

    <main class="flex-1 overflow-y-auto p-4 lg:p-6">
      <router-outlet />
    </main>
  </div>
</div>
