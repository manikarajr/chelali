<div class="flex h-screen bg-gray-100">
  <app-sidebar [isOpen]="sidebarOpen()" (closed)="sidebarOpen.set(false)" />

  <div class="flex flex-col flex-1 min-w-0 lg:ml-64">
    <!-- Mobile top bar -->
    <header class="lg:hidden flex items-center gap-3 px-4 h-14 bg-white border-b border-gray-200 shrink-0">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-4 h-4 text-white">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
      </div>
      <span class="text-sm font-bold text-gray-900 flex-1">Chelali Ice Plant</span>
      <!-- User profile -->
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-bold">
          A
        </div>
        <div class="hidden xs:block">
          <p class="text-xs font-medium text-gray-900 leading-none">Admin</p>
          <p class="text-[10px] text-gray-500 leading-none mt-0.5">Administrator</p>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-20 lg:pb-6 lg:p-6">
      <router-outlet />
    </main>
  </div>

  <!-- Hamburger menu backdrop -->
  @if (hamburgerOpen()) {
    <div
      class="lg:hidden fixed inset-0 z-40 bg-black/30"
      (click)="closeHamburger()"
    ></div>
  }

  <!-- Hamburger slide-up drawer -->
  <div
    class="lg:hidden fixed bottom-[calc(4rem+env(safe-area-inset-bottom,0px))] left-0 right-0 z-50 bg-white rounded-t-2xl shadow-xl border-t border-gray-200 transition-transform duration-300 ease-in-out"
    [class.translate-y-0]="hamburgerOpen()"
    [class.translate-y-full]="!hamburgerOpen()"
  >
    <div class="px-4 pt-4 pb-2">
      <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-4"></div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">More</p>
      @for (item of hamburgerNavItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-blue-50 text-blue-600"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          (click)="closeHamburger()"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-gray-700 hover:bg-gray-100 transition-colors duration-150"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
               stroke="currentColor" class="w-5 h-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          <span class="text-sm font-medium">{{ item.label }}</span>
        </a>
      }
      <!-- Logout -->
      <div class="border-t border-gray-100 mt-2 pt-2">
        <button
          type="button"
          (click)="logout()"
          class="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-red-500 hover:bg-red-50 transition-colors duration-150"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
               stroke="currentColor" class="w-5 h-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="text-sm font-medium">Sign Out</span>
        </button>
      </div>
    </div>
    <div class="pb-safe"></div>
  </div>

  <!-- Mobile bottom navbar -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 flex pb-safe">
    @for (item of bottomNavItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="text-blue-600"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2 text-gray-500 hover:text-blue-600 transition-colors duration-150"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-5 h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        <span class="text-[10px] font-medium leading-none">{{ item.label }}</span>
      </a>
    }

    <!-- Hamburger / More button -->
    <button
      type="button"
      (click)="toggleHamburger()"
      class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2 transition-colors duration-150"
      [class.text-blue-600]="hamburgerOpen()"
      [class.text-gray-500]="!hamburgerOpen()"
    >
      @if (hamburgerOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-5 h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-5 h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      }
      <span class="text-[10px] font-medium leading-none">More</span>
    </button>
  </nav>
</div>
