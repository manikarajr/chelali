<!-- Overlay (mobile) -->
@if (isOpen()) {
  <div class="fixed inset-0 bg-black/50 z-40 lg:hidden" (click)="closed.emit()"></div>
}

<aside [class]="sidebarClasses()">
  <!-- Brand -->
  <div class="flex items-center gap-3 px-5 py-5 border-b border-white/10">
    <div class="w-9 h-9 bg-blue-500 rounded-lg flex items-center justify-center shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor" class="w-5 h-5 text-white">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
    </div>
    <div>
      <p class="text-sm font-bold text-white">Chelali Ice Plant</p>
      <p class="text-xs text-gray-400">Management System</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-600 text-white"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-white/10 hover:text-white transition-colors duration-150 text-sm font-medium"
        (click)="closed.emit()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-5 h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- User Profile + Logout -->
  <div class="px-4 py-4 border-t border-white/10">
    <div class="flex items-center gap-3 mb-3">
      <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-bold shrink-0">
        A
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-medium text-white truncate">Admin</p>
        <p class="text-xs text-gray-400 truncate">Administrator</p>
      </div>
    </div>
    <button
      (click)="logout()"
      class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-gray-400 hover:bg-red-600/20 hover:text-red-400 transition-colors text-sm font-medium"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      Sign Out
    </button>
    <p class="text-xs text-gray-600 mt-2">v1.0.0 &copy; {{ currentYear }}</p>
  </div>
</aside>
