<aside [class]="sidebarClasses()">
  <!-- Brand (Desktop only) -->
  <div class="hidden lg:flex items-center gap-3 px-6 py-5 border-b border-gray-700">
    <div class="w-9 h-9 bg-blue-500 rounded-lg flex items-center justify-center shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor" class="w-5 h-5 text-white">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
    </div>
    <div>
      <p class="text-sm font-bold leading-none">Chelali Ice Plant</p>
      <p class="text-xs text-gray-400 mt-0.5">Management System</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 flex lg:flex-col items-center lg:items-stretch justify-around lg:justify-start overflow-y-auto lg:py-4 px-2 lg:px-3">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-600 text-white"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex flex-col lg:flex-row items-center gap-1 lg:gap-3 px-3 py-2 lg:py-2.5 rounded-lg text-gray-300 hover:bg-gray-800
               hover:text-white transition-[background-color,color] duration-150 ease-out text-[10px] lg:text-sm font-medium min-w-[60px] lg:min-w-0"
        (click)="closed.emit()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="w-6 h-6 lg:w-5 lg:h-5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        <span class="lg:inline">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- User Profile (Desktop only) -->
  <div class="hidden lg:block px-4 py-4 border-t border-gray-700">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-semibold shrink-0">
        A
      </div>
      <div class="min-w-0">
        <p class="text-sm font-medium text-white truncate">Admin</p>
        <p class="text-xs text-gray-400 truncate">Administrator</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-3">v1.0.0 &copy; {{ currentYear }}</p>
  </div>
</aside>
