<div class="space-y-4">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-gray-900">Transactions</h2>
      <p class="text-sm text-gray-500 mt-0.5 sm:mt-1">Ice purchase records</p>
    </div>
    <button
      (click)="openAdd()"
      class="flex items-center gap-2 px-3 sm:px-4 py-2 bg-blue-600 text-white text-sm font-medium
             rounded-lg hover:bg-blue-700 transition-colors shadow-sm shrink-0"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <span class="hidden sm:inline">New Transaction</span>
    </button>
  </div>

  <!-- Table Card -->
  <app-data-table
    [data]="transactions()"
    [columns]="columns"
    searchPlaceholder="Search transactions..."
    noDataMessage="No transactions found."
  >
    <!-- Custom Templates -->
    <ng-template #customCell let-item let-column="column">
        @if (column.key === 'customerId') {
            {{ customerName(item.customerId) }}
        } @else if (column.key === 'outstandingAmount') {
            <span [ngClass]="item.outstandingAmount > 0 ? 'text-red-600' : 'text-gray-400'">
                {{ item.outstandingAmount | currency:'INR':'symbol':'1.0-0' }}
            </span>
        }
    </ng-template>

    <ng-template #status let-t>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
              [ngClass]="{
                'bg-green-100 text-green-800': t.paymentStatus === 'paid',
                'bg-yellow-100 text-yellow-800': t.paymentStatus === 'partial',
                'bg-red-100 text-red-800': t.paymentStatus === 'unpaid'
              }">
          {{ t.paymentStatus | titlecase }}
        </span>
    </ng-template>

    <ng-template #actions let-t>
      <div class="flex items-center justify-center gap-2">
        <button
          (click)="openEdit(t)"
          class="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-colors"
          title="Edit"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
               stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125" />
          </svg>
        </button>
        <button
          (click)="delete(t.id)"
          class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors"
          title="Delete"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
               stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
          </svg>
        </button>
      </div>
    </ng-template>
  </app-data-table>
</div>

<!-- Slide Panel -->
<app-slide-panel
  [isOpen]="isPanelOpen()"
  [title]="editingTransaction() ? 'Edit Transaction' : 'New Transaction'"
  (closed)="closePanel()"
>
  <app-transaction-form
    [transaction]="editingTransaction()"
    [customers]="customers()"
    (saved)="onSaved($event)"
    (cancelled)="closePanel()"
  ></app-transaction-form>
</app-slide-panel>
