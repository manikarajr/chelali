<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <!-- Name -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Employee Name *</label>
    <input
      type="text"
      formControlName="name"
      placeholder="Full name"
      autocomplete="off"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    @if (form.get('name')?.invalid && form.get('name')?.touched) {
      <p class="text-xs text-red-500 mt-1">Name must be at least 2 characters.</p>
    }
  </div>

  <!-- Phone -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
    <input
      type="tel"
      formControlName="phone"
      placeholder="Optional"
      autocomplete="off"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <!-- Basic Salary -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Basic Monthly Salary (₹) *</label>
    <input
      type="number"
      inputmode="decimal"
      formControlName="basicSalary"
      placeholder="0"
      min="1"
      autocomplete="off"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    @if (form.get('basicSalary')?.invalid && form.get('basicSalary')?.touched) {
      <p class="text-xs text-red-500 mt-1">Salary must be greater than 0.</p>
    }
  </div>

  <!-- Status -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Status *</label>
    <select
      formControlName="status"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
    >
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>

  <!-- Actions -->
  <div class="flex gap-3 pt-2">
    <button
      type="submit"
      [disabled]="form.invalid"
      class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium
             rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
      {{ employee() ? 'Update Employee' : 'Add Employee' }}
    </button>
    <button
      type="button"
      (click)="cancelled.emit()"
      class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors"
    >
      Cancel
    </button>
  </div>
</form>
