<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <!-- Employee -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Employee *</label>
    <select
      formControlName="employeeId"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none
             focus:ring-2 focus:ring-blue-500 bg-white"
    >
      <option [value]="null" disabled>Select employee…</option>
      @for (emp of employees(); track emp.id) {
        <option [value]="emp.id">{{ emp.name }}</option>
      }
    </select>
    @if (form.get('employeeId')?.invalid && form.get('employeeId')?.touched) {
      <p class="text-xs text-red-500 mt-1">Please select an employee.</p>
    }
  </div>

  <!-- Payment Type -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Payment Type *</label>
    <select
      formControlName="paymentType"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none
             focus:ring-2 focus:ring-blue-500 bg-white"
    >
      @for (pt of paymentTypes; track pt.value) {
        <option [value]="pt.value">{{ pt.label }}</option>
      }
    </select>
  </div>

  <!-- Amount -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹) *</label>
    <input
      type="number"
      inputmode="decimal"
      formControlName="amount"
      placeholder="0"
      min="1"
      autocomplete="off"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none
             focus:ring-2 focus:ring-blue-500"
    />
    @if (form.get('amount')?.invalid && form.get('amount')?.touched) {
      <p class="text-xs text-red-500 mt-1">Amount must be greater than 0.</p>
    }
  </div>

  <!-- Date -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
    <input
      type="date"
      formControlName="date"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none
             focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <!-- Notes -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
    <textarea
      formControlName="notes"
      rows="3"
      placeholder="Optional notes…"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none
             focus:ring-2 focus:ring-blue-500 resize-none"
    ></textarea>
  </div>

  <!-- Actions -->
  <div class="flex gap-3 pt-2">
    <button
      type="submit"
      [disabled]="form.invalid"
      class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium
             rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
      {{ expense() ? 'Update Payment' : 'Record Payment' }}
    </button>
    <button
      type="button"
      (click)="cancelled.emit()"
      class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium
             rounded-lg hover:bg-gray-50 transition-colors"
    >
      Cancel
    </button>
  </div>
</form>
